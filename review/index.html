<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>GTL Design Review</title>
    <link rel="preconnect" href="https://esm.sh" />
    <link rel="stylesheet" href="review.css" />
    <script src="config.js"></script>
    <script type="module" src="review.js"></script>
  </head>
  <body>
    <main id="authView" class="auth-view" hidden>
      <section class="auth-card" aria-labelledby="authTitle">
        <div class="brand-mark" aria-hidden="true">G</div>
        <p class="eyebrow">Private workspace</p>
        <h1 id="authTitle">GTL design review</h1>
        <p class="auth-copy">Sign in with the reviewer account you were invited to use.</p>
        <form id="authForm" class="auth-form">
          <label>
            <span>Email</span>
            <input id="authEmail" type="email" autocomplete="email" required />
          </label>
          <label>
            <span>Password</span>
            <input id="authPassword" type="password" autocomplete="current-password" minlength="7" required />
          </label>
          <p id="authError" class="form-error" role="alert" hidden></p>
          <button class="button button-primary" type="submit">Sign in</button>
        </form>
      </section>
    </main>

    <main id="reviewView" class="review-view" hidden>
      <section class="review-stage">
        <div id="modeHint" class="mode-hint" hidden>Comment mode · click any element to add a pin</div>
        <div id="frameShell" class="frame-shell" data-device="desktop">
          <iframe id="prototypeFrame" title="GTL prototype" src="../gtl-app/home.html"></iframe>
        </div>
      </section>

      <div id="reviewDock" class="review-dock" data-review-ui>
        <div id="pageMenuWrap" class="page-menu-wrap">
          <button id="currentPageButton" class="dock-pill dock-page" type="button" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h4v4h-4zM9.5 3.5h4v4h-4zM2.5 10h4v2.5h-4zM9.5 10h4v2.5h-4z" /></svg>
            <span id="currentPageLabel">Home</span>
            <svg class="dock-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m5 6 3 3 3-3" /></svg>
          </button>

          <div id="reviewMenu" class="review-menu page-menu" role="menu" aria-label="Select a design page" hidden>
            <section class="review-menu-section" aria-labelledby="pagesLabel">
              <p id="pagesLabel" class="review-menu-label">Design pages</p>
              <div id="menuPages" class="review-menu-pages"></div>
            </section>
          </div>
        </div>

        <div id="deviceSwitch" class="dock-segment device-switch" role="group" aria-label="Preview device size">
          <button class="dock-segment-button is-active" type="button" data-device="desktop" aria-label="Desktop" title="Desktop">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 2.8h11.6v8H2.2zM5.5 13.2h5M8 10.8v2.4" /></svg>
          </button>
          <button class="dock-segment-button" type="button" data-device="tablet" aria-label="Tablet" title="Tablet">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.3" y="1.5" width="9.4" height="13" rx="1.3" /><path d="M7 12.2h2" /></svg>
          </button>
          <button class="dock-segment-button" type="button" data-device="mobile" aria-label="Mobile" title="Mobile">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4.8" y="1.2" width="6.4" height="13.6" rx="1.3" /><path d="M7.2 12.5h1.6" /></svg>
          </button>
        </div>

        <button id="commentsButton" class="dock-pill" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10v7H7l-3.2 2.3.7-2.3H3z" /></svg>
          <span>Comments</span>
          <span id="openCount" class="count">0</span>
        </button>

        <div id="visibilitySwitch" class="dock-segment" role="group" aria-label="Visible comments" hidden>
          <button class="dock-segment-button is-active" type="button" data-dock-filter="open">Open</button>
          <button class="dock-segment-button" type="button" data-dock-filter="all">All</button>
        </div>

        <div>
          <button id="modeButton" class="dock-menu-button" type="button" aria-label="Enter comment mode" aria-pressed="false">
            <svg class="menu-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2a3.8 3.8 0 0 0-3.8 3.8c0 2.8 3.8 7 3.8 7s3.8-4.2 3.8-7A3.8 3.8 0 0 0 8 2.2Z" /><circle cx="8" cy="6" r="1.35" /></svg>
            <svg class="close-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" /></svg>
          </button>
        </div>
      </div>

      <aside id="reviewPanel" class="review-panel" aria-label="Review comments" aria-hidden="true">
        <div id="panelContent"></div>
      </aside>
      <button id="panelBackdrop" class="panel-backdrop" type="button" aria-label="Close comments" hidden></button>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
