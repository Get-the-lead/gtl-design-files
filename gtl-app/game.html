<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTL — Live game</title>
  <script>try{var t=localStorage.getItem('gtl-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="game.css" />
</head>
<body class="game-body">

  <!-- Floating header (shared) -->
  <header class="site-header" id="siteHeader"></header>

  <!-- Game content (rendered by app.js from ?id=) -->
  <main id="gameMain"></main>

  <!-- Sticky Bet Now (appears when the markets scroll out of view) -->
  <div class="betbar" id="betBar">
    <div class="container betbar-inner">
      <button class="btn btn-primary betbar-cta">View Bets</button>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
