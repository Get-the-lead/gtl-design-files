<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTL - Login</title>
  <script>try{var t=localStorage.getItem('gtl-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <script>(function(){try{if(sessionStorage.getItem('gtl-gate')==='ok')return;}catch(e){return;}location.replace('index.html');})();</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css?v=20260728-7" />
  <link rel="stylesheet" href="auth.css?v=20260728-7" />
</head>
<body class="auth-body auth-login">
  <header class="site-header" id="siteHeader"></header>

  <main class="auth-main">
    <div class="auth-card">
      <a class="auth-close" href="login.html" aria-label="Close login">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </a>

      <div class="auth-steps" data-step="1" id="loginPrototypeSteps">
        <div class="auth-step" data-step="1">
          <div class="auth-head">
            <span class="eyebrow">Welcome back</span>
            <h1>Login to GTL</h1>
            <p>Choose how you’d like to sign in.</p>
          </div>

          <div class="social-row">
            <button class="social-btn" type="button" data-social="google">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.2c0-.7-.06-1.4-.18-2.06H12v3.9h5.9a5.04 5.04 0 0 1-2.18 3.31v2.75h3.53c2.07-1.9 3.25-4.71 3.25-7.9z"/><path fill="#34A853" d="M12 23c2.94 0 5.4-.97 7.2-2.63l-3.52-2.75c-.98.66-2.23 1.05-3.68 1.05-2.83 0-5.23-1.91-6.08-4.48H2.28v2.84A10.99 10.99 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.92 14.19a6.6 6.6 0 0 1 0-4.38V6.97H2.28a11 11 0 0 0 0 10.06l3.64-2.84z"/><path fill="#EA4335" d="M12 5.13c1.6 0 3.03.55 4.16 1.62l3.12-3.12A10.98 10.98 0 0 0 12 1 10.99 10.99 0 0 0 2.28 6.97l3.64 2.84C6.77 7.04 9.17 5.13 12 5.13z"/></svg>
              Continue with Google
            </button>
            <button class="social-btn" type="button" data-social="apple">
              <svg class="apple-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.05 12.66c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.1-2.01-3.77-2.04-1.6-.16-3.13.94-3.94.94-.81 0-2.07-.92-3.4-.9-1.75.03-3.36 1.02-4.26 2.58-1.82 3.15-.47 7.82 1.3 10.38.86 1.25 1.89 2.66 3.24 2.61 1.3-.05 1.79-.84 3.36-.84 1.57 0 2.01.84 3.39.81 1.4-.02 2.28-1.28 3.13-2.54.99-1.45 1.4-2.86 1.42-2.93-.03-.01-2.72-1.04-2.46-4.6zM14.6 5.1c.72-.87 1.2-2.08 1.07-3.28-1.03.04-2.28.69-3.02 1.56-.66.76-1.24 1.99-1.09 3.16 1.15.09 2.32-.58 3.04-1.44z"/></svg>
              Continue with Apple
            </button>
          </div>

          <div class="auth-divider">or</div>

          <form class="auth-form" data-prototype-login-form novalidate>
            <div class="field">
              <label for="prototypeLoginPhone">Phone number</label>
              <input class="field-input" id="prototypeLoginPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 123-4567" required />
            </div>
            <button class="btn btn-primary auth-submit" type="submit" data-prototype-login-submit disabled>Continue with Phone</button>
          </form>
        </div>

        <div class="auth-step" data-step="2">
          <button class="step-back" type="button" data-prototype-login-back="1">
            <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Back
          </button>
          <div class="auth-head">
            <h1>Verify it’s you</h1>
            <p>Enter the 8-digit verification code sent to <span class="code-sent-to" data-prototype-login-destination>your account</span>.</p>
          </div>
          <form data-prototype-login-code-form novalidate>
            <div class="code-input" data-code-input>
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
              <span class="code-dash" aria-hidden="true"></span>
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 7" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 8" />
            </div>
            <button class="btn btn-primary auth-submit" type="submit">Verify and Login</button>
          </form>
          <p class="code-resend">Didn't get a code? <button type="button" data-prototype-login-resend>Resend</button></p>
        </div>
      </div>

      <p class="auth-foot">New to GTL? <a href="signup-v2.html">Create an Account</a></p>
      <p class="prototype-switch"><a href="login.html">Return to the current sign-in flow</a></p>
    </div>
  </main>

  <script src="app.js?v=20260728-7" defer></script>
</body>
</html>
