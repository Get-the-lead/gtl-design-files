<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTL — Live game (design B)</title>
  <script>try{var t=localStorage.getItem('gtl-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <!-- game-b uses game.html's exact layout, then game-b.css applies the one bet-row difference -->
  <link rel="stylesheet" href="game.css" />
  <link rel="stylesheet" href="game-b.css" />
  <!-- -b variant: styling for the second "enter price" bet drawer -->
  <link rel="stylesheet" href="bet-b.css" />
</head>
<body class="game-body game-b-body">

  <!-- Floating header (shared) -->
  <header class="site-header" id="siteHeader"></header>

  <!-- Game content (rendered by app.js from ?id=) -->
  <main id="gameMain"></main>

  <!-- Sticky Bet Now (appears when the markets scroll out of view) -->
  <div class="betbar" id="betBar">
    <div class="container betbar-inner">
      <button class="btn btn-primary betbar-cta">View Bets</button>
    </div>
  </div>

  <!-- Shared app logic, then the -b-variant second bet drawer (routes bet clicks to itself) -->
  <script src="app.js" defer></script>
  <script src="bet-b.js" defer></script>
</body>
</html>
