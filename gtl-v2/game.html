<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTL — Live game</title>
  <script>try{var t=localStorage.getItem('gtl-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="game.css" />
</head>
<body class="game-body">

  <!-- Floating header (shared) -->
  <header class="site-header" id="siteHeader">
    <div class="header-row">
      <div class="header-left">
        <button class="header-menu floating-btn" id="menuBtn" aria-expanded="false" aria-controls="menuPanel">
          <span>Menu</span>
        </button>
      </div>
      <a class="brand floating-logo" href="home.html" aria-label="GTL home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 16.5 10 10l3.5 3.5L20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6h5v5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
      <div class="header-right">
        <a class="btn header-login floating-btn" href="#">Login</a>
      </div>
    </div>

    <div class="menu-panel" id="menuPanel" hidden>
      <a href="home.html#live">Live games</a>
      <a href="home.html#how">How it works</a>
      <a href="#">Tutorial</a>
      <button class="theme-toggle menu-theme" id="themeBtn" aria-label="Switch colour theme">
        <span>Appearance</span>
        <span class="menu-theme-value">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="label-dark">Dark</span>
          <span class="label-light">Light</span>
        </span>
      </button>
      <div class="menu-actions">
        <a class="btn btn-secondary btn-block" href="#">Log in</a>
        <a class="btn btn-primary btn-block" href="#">Create account</a>
      </div>
    </div>
  </header>

  <!-- Game content (rendered by app.js from ?id=) -->
  <main id="gameMain"></main>

  <!-- Sticky Bet Now (appears when the markets scroll out of view) -->
  <div class="betbar" id="betBar">
    <div class="container betbar-inner">
      <div class="betbar-meta">
        <span class="betbar-label">Get the Lead</span>
        <span class="betbar-hint">Live price</span>
      </div>
      <button class="btn btn-primary betbar-cta">Bet now</button>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
